## Onderwerp: Fangirlen

Mijn onderwerp gaat in algemene zin over fangirlen. Ik wil vertellen hoe de muziekgroepen waar ik fan van ben in de loop der tijd zijn veranderd en geëvolueerd naarmate mijn eigen stijl en kijk op kunst veranderden, en hoe ik door de jaren heen verschillende perspectieven heb opgedaan van de vele mensen van wie ik fan ben geweest. Tegelijkertijd wil ik ook informatieve inzichten bieden over het fenomeen fangirlen zelf.

---

Omdat ik wilde dat de website ook informatief zou zijn, heb ik onderzocht vanuit welke invalshoeken ik het onderwerp fangirlen zou kunnen benaderen.

## Introtekst
##### For a long time, being a young girl who loved things intensely felt like something to be embarrassed about. I felt an instinctive need to hide my interests, without realizing that suppressing my fandoms meant hiding my core personality, curiosity, and hobbies along with them. Looking back, that quiet shame was shaped by how society often dismisses young women's passions as trivial. In this project, I explore the subconscious reasons behind that defense mechanism and trace my journey through the subcultures, music, and aesthetics that changed me. By looking back these turning points, I want to highlight how embracing what I love ultimately defined who I am as a person today.
