## Onderwerp: Fangirlen

Mijn onderwerp gaat in algemene zin over fangirlen. Ik wil vertellen hoe de muziekgroepen waar ik fan van ben in de loop der tijd zijn veranderd en geëvolueerd naarmate mijn eigen stijl en kijk op kunst veranderden, en hoe ik door de jaren heen verschillende perspectieven heb opgedaan van de vele mensen van wie ik fan ben geweest. Tegelijkertijd wil ik ook informatieve inzichten bieden over het fenomeen fangirlen zelf.

---

## Inspiratie Bronnen
- [The Culture of Fangirling](https://medium.com/@kshravani744/the-culture-of-fangirling-2b6b46b02e89)
- [A Deep Dive into Fangirl Culture](https://afractionofmymind.substack.com/p/a-deep-dive-into-fangirl-culture)
- [Why Sexism Drives the Shaming of Fangirls](https://www.hotpress.com/opinion/sexism-drives-shaming-fangirls-22795025)
- [Why Our Passions Change, and Why That's OK](https://www.psychologytoday.com/us/blog/shadow-boxing/201408/why-our-passions-change-and-why-thats-ok)
- [Kpopping (database)](https://kpopping.com/)
- [Let Your Hobbies Enhance Your Career](https://blog.annabyang.com/let-your-hobbies-enhance-your-career/)

Omdat ik wilde dat de website ook informatief zou zijn, heb ik onderzocht vanuit welke invalshoeken ik het onderwerp fangirlen zou kunnen benaderen.
